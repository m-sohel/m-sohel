<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 340" width="100%" height="auto">
  <defs>
    <!-- Background Canvas matching GitHub Dark #0D1117 -->
    <linearGradient id="bgGrad" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#080B14" />
      <stop offset="60%" stop-color="#0D1117" />
      <stop offset="100%" stop-color="#0D1117" />
    </linearGradient>

    <!-- Aurora Radial Glows -->
    <radialGradient id="auroraViolet" cx="28%" cy="30%" r="65%">
      <stop offset="0%" stop-color="#A855F7" stop-opacity="0.32" />
      <stop offset="55%" stop-color="#7C3AED" stop-opacity="0.10" />
      <stop offset="100%" stop-color="#0D1117" stop-opacity="0" />
    </radialGradient>

    <radialGradient id="auroraIndigo" cx="75%" cy="38%" r="60%">
      <stop offset="0%" stop-color="#6366F1" stop-opacity="0.28" />
      <stop offset="55%" stop-color="#4F46E5" stop-opacity="0.08" />
      <stop offset="100%" stop-color="#0D1117" stop-opacity="0" />
    </radialGradient>

    <radialGradient id="auroraCyan" cx="50%" cy="15%" r="45%">
      <stop offset="0%" stop-color="#67E8F9" stop-opacity="0.20" />
      <stop offset="65%" stop-color="#06B6D4" stop-opacity="0.03" />
      <stop offset="100%" stop-color="#0D1117" stop-opacity="0" />
    </radialGradient>

    <!-- Text Metallic Aurora Gradient -->
    <linearGradient id="textGrad" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#FFFFFF" />
      <stop offset="40%" stop-color="#F3E8FF" />
      <stop offset="75%" stop-color="#E0E7FF" />
      <stop offset="100%" stop-color="#BAE6FD" />
    </linearGradient>

    <!-- Pill Gradient -->
    <linearGradient id="pillGrad" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#A855F7" stop-opacity="0.25" />
      <stop offset="100%" stop-color="#6366F1" stop-opacity="0.25" />
    </linearGradient>

    <!-- Horizon Line Gradient -->
    <linearGradient id="lineGrad" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#A855F7" stop-opacity="0" />
      <stop offset="25%" stop-color="#A855F7" stop-opacity="0.6" />
      <stop offset="50%" stop-color="#67E8F9" stop-opacity="0.9" />
      <stop offset="75%" stop-color="#6366F1" stop-opacity="0.6" />
      <stop offset="100%" stop-color="#6366F1" stop-opacity="0" />
    </linearGradient>

    <!-- Fine Grid Pattern -->
    <pattern id="grid" width="40" height="40" patternUnits="userSpaceOnUse">
      <path d="M 40 0 L 0 0 0 40" fill="none" stroke="#6366F1" stroke-width="0.75" stroke-opacity="0.08" />
    </pattern>

    <!-- Sparkle Symbol -->
    <g id="sparkle">
      <path d="M0,-8 Q0,0 8,0 Q0,0 0,8 Q0,0 -8,0 Q0,0 0,-8 Z" fill="#67E8F9" fill-opacity="0.85" />
    </g>
  </defs>

  <style>
    .font-sans { font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', 'Inter', Roboto, Helvetica, Arial, sans-serif; }
    .font-mono { font-family: 'SF Mono', 'Fira Code', 'Cascadia Code', 'JetBrains Mono', Consolas, monospace; }
  </style>

  <!-- Base Canvas (Seamless with GitHub Dark #0D1117) -->
  <rect width="1200" height="340" fill="url(#bgGrad)" />

  <!-- Grid Layer (fading smoothly at bottom) -->
  <rect width="1200" height="280" fill="url(#grid)" />

  <!-- Aurora Glows -->
  <rect width="1200" height="340" fill="url(#auroraViolet)" />
  <rect width="1200" height="340" fill="url(#auroraIndigo)" />
  <rect width="1200" height="340" fill="url(#auroraCyan)" />

  <!-- Ambient Wave Streams -->
  <path d="M-50,210 C250,130 450,250 750,160 C950,100 1100,170 1250,140 L1250,340 L-50,340 Z" fill="#A855F7" fill-opacity="0.04" />
  <path d="M-50,260 C300,180 550,290 850,200 C1020,150 1150,210 1250,190 L1250,340 L-50,340 Z" fill="#6366F1" fill-opacity="0.05" />

  <!-- Constellation Particles -->
  <circle cx="110" cy="65" r="1.5" fill="#E6EDF3" fill-opacity="0.7" />
  <circle cx="210" cy="105" r="1" fill="#67E8F9" fill-opacity="0.85" />
  <circle cx="330" cy="55" r="1.5" fill="#C4B5FD" fill-opacity="0.75" />
  <circle cx="470" cy="90" r="1" fill="#E6EDF3" fill-opacity="0.4" />
  <circle cx="730" cy="60" r="1.5" fill="#67E8F9" fill-opacity="0.75" />
  <circle cx="870" cy="110" r="1" fill="#E6EDF3" fill-opacity="0.6" />
  <circle cx="990" cy="75" r="1.5" fill="#C4B5FD" fill-opacity="0.85" />
  <circle cx="1090" cy="125" r="1" fill="#67E8F9" fill-opacity="0.7" />
  <circle cx="1135" cy="55" r="2" fill="#E6EDF3" fill-opacity="0.8" />
  <circle cx="95" cy="225" r="1" fill="#C4B5FD" fill-opacity="0.5" />
  <circle cx="1105" cy="255" r="1.5" fill="#E6EDF3" fill-opacity="0.5" />

  <!-- Sparkle Accents -->
  <use href="#sparkle" x="150" y="75" transform="scale(0.85)" />
  <use href="#sparkle" x="1050" y="85" transform="scale(0.7)" />
  <use href="#sparkle" x="930" y="225" transform="scale(0.55)" />

  <!-- Top Pill Badge -->
  <g transform="translate(600, 62)">
    <rect x="-195" y="-15" width="390" height="30" rx="15" fill="url(#pillGrad)" stroke="#A855F7" stroke-width="1" stroke-opacity="0.5" />
    <circle cx="-172" cy="0" r="4" fill="#67E8F9" />
    <circle cx="-172" cy="0" r="7" fill="#67E8F9" fill-opacity="0.3" />
    <text x="-154" y="4.5" class="font-mono" font-size="11" font-weight="600" fill="#E6EDF3" letter-spacing="1.5">FULL STACK DEVELOPER · FOUNDER @ VIER LABS</text>
  </g>

  <!-- Main Name Heading -->
  <text x="600" y="146" text-anchor="middle" class="font-sans" font-size="56" font-weight="800" fill="url(#textGrad)" letter-spacing="-1">
    Mohammad Sohel
  </text>

  <!-- Tagline / Architecture Statement -->
  <text x="600" y="190" text-anchor="middle" class="font-sans" font-size="17" font-weight="400" fill="#94A3B8" letter-spacing="0.3">
    Building Modern Web Applications · Pragmatic Architecture · Production-Ready Systems
  </text>

  <!-- Horizontal Aurora Divider -->
  <line x1="260" y1="225" x2="940" y2="225" stroke="url(#lineGrad)" stroke-width="1.5" />

  <!-- Core Competency Tags -->
  <g transform="translate(600, 268)" text-anchor="middle">
    <!-- Tag 1 -->
    <g transform="translate(-230, 0)">
      <rect x="-85" y="-14" width="170" height="28" rx="6" fill="#0D1117" stroke="#30363D" stroke-width="1" />
      <circle cx="-65" cy="0" r="3" fill="#A855F7" />
      <text x="-52" y="4.5" text-anchor="start" class="font-mono" font-size="11" fill="#C4B5FD">Clean Architecture</text>
    </g>

    <!-- Tag 2 -->
    <g transform="translate(0, 0)">
      <rect x="-85" y="-14" width="170" height="28" rx="6" fill="#0D1117" stroke="#30363D" stroke-width="1" />
      <circle cx="-65" cy="0" r="3" fill="#67E8F9" />
      <text x="-52" y="4.5" text-anchor="start" class="font-mono" font-size="11" fill="#BAE6FD">Full-Stack Systems</text>
    </g>

    <!-- Tag 3 -->
    <g transform="translate(230, 0)">
      <rect x="-85" y="-14" width="170" height="28" rx="6" fill="#0D1117" stroke="#30363D" stroke-width="1" />
      <circle cx="-65" cy="0" r="3" fill="#6366F1" />
      <text x="-52" y="4.5" text-anchor="start" class="font-mono" font-size="11" fill="#C7D2FE">Vier Labs Founder</text>
    </g>
  </g>
</svg>
