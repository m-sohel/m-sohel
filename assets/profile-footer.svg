<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 90" width="100%" height="auto">
  <defs>
    <!-- Background matching #0D1117 -->
    <linearGradient id="footerBg" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#0D1117" />
      <stop offset="100%" stop-color="#080B14" />
    </linearGradient>

    <!-- Aurora Glows -->
    <radialGradient id="footerViolet" cx="40%" cy="50%" r="60%">
      <stop offset="0%" stop-color="#A855F7" stop-opacity="0.25" />
      <stop offset="60%" stop-color="#7C3AED" stop-opacity="0.05" />
      <stop offset="100%" stop-color="#0D1117" stop-opacity="0" />
    </radialGradient>

    <radialGradient id="footerIndigo" cx="65%" cy="50%" r="55%">
      <stop offset="0%" stop-color="#6366F1" stop-opacity="0.22" />
      <stop offset="60%" stop-color="#4F46E5" stop-opacity="0.04" />
      <stop offset="100%" stop-color="#0D1117" stop-opacity="0" />
    </radialGradient>

    <!-- Ray Gradient -->
    <linearGradient id="footerRay" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#A855F7" stop-opacity="0" />
      <stop offset="40%" stop-color="#A855F7" stop-opacity="0.5" />
      <stop offset="50%" stop-color="#67E8F9" stop-opacity="0.9" />
      <stop offset="60%" stop-color="#6366F1" stop-opacity="0.5" />
      <stop offset="100%" stop-color="#6366F1" stop-opacity="0" />
    </linearGradient>

    <!-- Sparkle Symbol -->
    <g id="miniSparkle">
      <path d="M0,-5 Q0,0 5,0 Q0,0 0,5 Q0,0 -5,0 Q0,0 0,-5 Z" fill="#67E8F9" fill-opacity="0.8" />
    </g>
  </defs>

  <style>
    .font-mono { font-family: 'SF Mono', 'Fira Code', 'Cascadia Code', 'JetBrains Mono', Consolas, monospace; }
  </style>

  <!-- Seamless Canvas -->
  <rect width="1200" height="90" fill="url(#footerBg)" />

  <!-- Aurora Glows -->
  <rect width="1200" height="90" fill="url(#footerViolet)" />
  <rect width="1200" height="90" fill="url(#footerIndigo)" />

  <!-- Subtle Horizon Stars -->
  <circle cx="160" cy="30" r="1" fill="#E6EDF3" fill-opacity="0.6" />
  <circle cx="290" cy="55" r="1" fill="#67E8F9" fill-opacity="0.7" />
  <circle cx="910" cy="25" r="1" fill="#C4B5FD" fill-opacity="0.7" />
  <circle cx="1050" cy="50" r="1.5" fill="#E6EDF3" fill-opacity="0.5" />
  <use href="#miniSparkle" x="210" y="20" />
  <use href="#miniSparkle" x="990" y="60" />

  <!-- Horizon Ray Line -->
  <line x1="150" y1="28" x2="1050" y2="28" stroke="url(#footerRay)" stroke-width="1.2" />

  <!-- Center Emblem & Attribution -->
  <g transform="translate(600, 28)" text-anchor="middle">
    <polygon points="0,-7 7,0 0,7 -7,0" fill="#0D1117" stroke="#67E8F9" stroke-width="1.2" />
    <circle cx="0" cy="0" r="2" fill="#A855F7" />
    <text y="32" class="font-mono" font-size="11" font-weight="600" fill="#94A3B8" letter-spacing="2">
      VIER LABS · CRAFTED BY MOHAMMAD SOHEL
    </text>
  </g>
</svg>
